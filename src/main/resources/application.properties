spring.application.name=bcradata

spring.messages.basename=messages
spring.messages.encoding=UTF-8
#Logging Configurations

logging.config=src/main/resources/logback.xml

spring.config.import=optional:file:.env.local[.properties]

#JPA Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

#base datos
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST_MYSQL}:${SPRING_DATASOURCE_PORT_MYSQL}/${SPRING_DATASOURCE_DATABASE}?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${SPRING_DATASOURCE_USER_NAME_MYSQL}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_MYSQL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=${SPRING_DATASOURCE_URL_H2_MEM}
#spring.datasource.url=${SPRING_DATASOURCE_URL_H2_FILE}
#spring.datasource.username=${SPRING_DATASOURCE_USER_NAME_H2}
#spring.datasource.password=${SPRING_DATASOURCE_PASWORD_H2}
#spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_H2}

#H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
